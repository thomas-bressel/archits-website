services:
  archits-website:
    container_name: archits-website-app-dev
    build: 
      context: .
      dockerfile: Dockerfile
    # image: ${DOCKERHUB_USERNAME}/archits-website:latest  # Commenté pour le dev
    restart: unless-stopped
    ports:
      - "4000:4000"  # Accès direct sans nginx
    networks:
      - archits-website-dev-net
    environment:
      - NODE_ENV=development
    # Volumes pour le hot reload (ajustez selon votre structure)
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - /app/node_modules  # Évite d'écraser node_modules

  # Configuration nginx simplifiée pour le dev (optionnel)
  nginx-dev:
    image: nginx:alpine
    container_name: archits-website-nginx-dev
    restart: unless-stopped
    ports:
      - "8080:80"  # Port différent pour éviter les conflits
    depends_on:
      - archits-website
    networks:
      - archits-website-dev-net
    command: >
      sh -c "
      echo '
      server {
        listen 80;
        server_name localhost;

        location / {
          proxy_pass http://archits-website:4000;
          proxy_http_version 1.1;
          proxy_set_header Host \$host;
          proxy_set_header X-Real-IP \$remote_addr;
          proxy_set_header X-Forwarded-For \$proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto \$scheme;
        }
      }' > /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'
      "
      
networks:
  archits-website-dev-net:
    name: archits-website-dev-net
    driver: bridge